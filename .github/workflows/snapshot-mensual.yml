name: Snapshot mensual

# Corre el día 1 de cada mes: scrapea el padrón, genera los agregados
# anonimizados, guarda el snapshot fechado y actualiza el evolutivo.
# El CSV crudo (con PII) vive solo en el runner efímero y nunca se commitea.
on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Snapshot a generar (YYYY-MM). Vacío = mes actual.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Scrapear padrón
        run: python administradores_scraper.py

      - name: Generar agregados + snapshot
        run: |
          if [ -n "${{ github.event.inputs.snapshot }}" ]; then
            python generar_agregados.py --snapshot "${{ github.event.inputs.snapshot }}"
          else
            python generar_agregados.py --snapshot
          fi

      - name: Generar evolutivo
        run: python generar_evolutivo.py

      - name: Commit y push de la data (solo agregados, sin PII)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/agregados data/snapshots data/evolutivo
          if git diff --cached --quiet; then
            echo "Sin cambios en la data: no se commitea nada."
            exit 0
          fi
          SNAPSHOT="${{ github.event.inputs.snapshot }}"
          [ -z "$SNAPSHOT" ] && SNAPSHOT=$(date -u +%Y-%m)
          git commit -m "data: snapshot mensual $SNAPSHOT"
          git push
